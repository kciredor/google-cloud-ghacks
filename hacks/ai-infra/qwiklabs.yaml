schema_version: 2
default_locale: en
title: "[gHacks] AI Infrastructure with Google"
description: "Running AI workloads requires specific infrastructure. We will go hands-on with accelerators like GPUs. Further, let's bridge the gap between hardware and software with platforms like Vertex AI."
instruction:
  type: md
  uri: README.md
duration: 300
max_duration: 480
credits: 0
level: intermediate
tags: [infrastructure, machine-learning]
product_tags: [cloud-ai, cloud-run, cloud-tpu, compute-engine, kubernetes-engine]
role_tags: [cloud-architect, data-engineer, application-developer]
domain_tags:
environment:
  resources:
    - type: gcp_project
      id: project
      # Important: this unlocks GPU capacity, currently 8x L4.
      variant: gcp_medium_extra
      startup_script:
        type: qwiklabs
        path: artifacts
    - type: gcp_user
      id: user_1
      permissions:
        - project: project
          roles:
            - roles/owner
    - type: gcp_user
      id: user_2
      permissions:
        - project: project
          roles:
            - roles/owner
    - type: gcp_user
      id: user_3
      permissions:
        - project: project
          roles:
            - roles/owner
    - type: gcp_user
      id: user_4
      permissions:
        - project: project
          roles:
            - roles/owner
    - type: gcp_user
      id: user_5
      permissions:
        - project: project
          roles:
            - roles/owner

  student_visible_outputs:
    - label: Open Console
      reference: project.console_url
    - label: Username 1
      reference: user_1.username
    - label: Password 1
      reference: user_1.password
    - label: Username 2
      reference: user_2.username
    - label: Password 2
      reference: user_2.password
    - label: Username 3
      reference: user_3.username
    - label: Password 3
      reference: user_3.password
    - label: Username 4
      reference: user_4.username
    - label: Password 4
      reference: user_4.password
    - label: Username 5
      reference: user_5.username
    - label: Password 5
      reference: user_5.password
    - label: Project ID
      reference: project.project_id
